name: Release - リリース処理

# リリース時のみ実行
on:
  release:
    types: [published]
  workflow_dispatch:  # 手動実行も可能

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Javaセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: フルテスト実行
      run: mvn clean verify
    
    - name: JARファイル作成
      run: mvn package -DskipTests
    
    - name: アーティファクトアップロード
      uses: actions/upload-artifact@v4
      with:
        name: jar-artifacts
        path: target/*.jar
    

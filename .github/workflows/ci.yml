name: CI - 継続的インテグレーション

# 毎回実行する基本的なチェック
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # 高速フィードバック（1-2分）
  quick-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Javaセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    
    - name: ビルド確認
      run: mvn clean compile
    
    - name: 単体テスト実行
      run: mvn test
    
    - name: テストレポート生成
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: 単体テスト結果
        path: target/surefire-reports/*.xml
        reporter: java-junit
name: 総合的なテストとビルド検証

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. ビルド検証
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Javaセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: ビルド実行
      run: mvn clean compile
    
    - name: JARファイル作成
      run: mvn package -DskipTests
    
    - name: ビルド成果物の確認
      run: |
        echo "ビルドされたJARファイル:"
        ls -la target/*.jar

  # 2. 単体テスト
  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Javaセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    - name: 単体テスト実行
      run: mvn test
    
    - name: テストカバレッジ計測
      run: mvn test jacoco:report

  # 3. コード品質チェック
  code-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Javaセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    # Checkstyle（コードスタイル）
    - name: Checkstyleチェック
      run: mvn checkstyle:check || true
    
    # SpotBugs（バグ検出）
    - name: SpotBugsチェック
      run: mvn spotbugs:check || true

  # 4. セキュリティチェック
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # 依存関係の脆弱性チェック
    - name: OWASP Dependency Check
      run: |
        mvn org.owasp:dependency-check-maven:check || true
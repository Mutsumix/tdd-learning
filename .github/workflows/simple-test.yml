name: シンプルなテスト実行

# いつ実行するか
on:
  push:    # プッシュしたとき
  pull_request:    # プルリクエストを作ったとき

# 何を実行するか
jobs:
  test:
    runs-on: ubuntu-latest    # 実行環境
    
    steps:
    # 1. コードを取得
    - uses: actions/checkout@v4
    
    # 2. Java環境を準備
    - name: Javaをセットアップ
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
    
    # 3. テストを実行
    - name: テスト実行
      run: mvn test